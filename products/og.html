<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>OGP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "BIZ UDPGothic", sans-serif; color: #173f33;
    background-color: #fdf6ea; background-image: linear-gradient(rgba(31,92,74,.09) 1px, transparent 1px), linear-gradient(90deg, rgba(31,92,74,.09) 1px, transparent 1px); background-size: 30px 30px; }
  .top { height: 18px; background: #1f5c4a; border-bottom: 8px solid #f5a25a; }
  .in { padding: 52px 72px 0; }
  .brand { display: flex; align-items: center; gap: 16px; font-family: "Zen Kaku Gothic New"; font-weight: 900; font-size: 34px; letter-spacing: .04em; }
  .seal { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 8px; background: #1f5c4a; color: #fff; font-size: 34px; }
  h1 { margin: 34px 0 0; font-family: "Zen Kaku Gothic New"; font-weight: 900; font-size: 74px; line-height: 1.3; letter-spacing: .01em; }
  h1 span { color: #b3541a; background: linear-gradient(transparent 60%, #ffe2c2 60%); }
  .tags { display: flex; gap: 12px; margin-top: 34px; }
  .tag { padding: 8px 22px; border-radius: 999px; font-family: "Zen Kaku Gothic New"; font-weight: 900; font-size: 26px; color: #fff; }
  .j { background: #2a7fb8; } .s { background: #3d8c4b; } .k { background: #cf6526; }
  .free { margin-left: auto; align-self: center; font-size: 28px; font-weight: 700; color: #1f5c4a; border: 3px solid #1f5c4a; border-radius: 12px; padding: 6px 18px; background: #fff; }
  .docs { position: absolute; left: 72px; right: 72px; bottom: 34px; font-size: 21px; color: #464d54; letter-spacing: .02em; }
</style>
</head>
<body>
<div class="top"></div>
<div class="in">
  <div class="brand"><span class="seal">帳</span>ふくしのおたすけ帳</div>
  <h1>福祉の現場の書類を、<br><span>選ぶだけで下書き。</span></h1>
  <div class="tags"><span class="tag j">児童支援</span><span class="tag s">障害福祉</span><span class="tag k">介護</span><span class="free">無料・登録不要</span></div>
</div>
<p class="docs">個別支援計画・モニタリング・支援記録・介護記録・事故報告・ヒヤリハット・委員会議事録・研修計画 ほか</p>
</body>
</html>
