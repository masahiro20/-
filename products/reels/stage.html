<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>reel stage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
  /* 432×768 の画面を 2.5倍で撮って 1080×1920 の動画にする */
  html, body { margin: 0; width: 432px; height: 768px; overflow: hidden; }
  body { position: relative; font-family: "BIZ UDPGothic", sans-serif; color: #173f33;
    background-color: #fdf6ea; background-image: linear-gradient(rgba(31,92,74,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(31,92,74,.08) 1px, transparent 1px); background-size: 18px 18px; }
  em { font-style: normal; color: #b3541a; background: linear-gradient(transparent 58%, #ffe2c2 58%); }
  .series { position: absolute; left: 20px; top: 26px; display: flex; align-items: center; gap: 7px; font-family: "Zen Kaku Gothic New"; font-weight: 900; font-size: 13px; letter-spacing: .04em; }
  .seal { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 5px; background: #1f5c4a; color: #fff; font-size: 14px; }
  .series .no { background: #f5a25a; color: #173f33; border-radius: 999px; padding: 1px 9px; font-size: 12px; }
  #cap { position: absolute; left: 20px; right: 56px; top: 62px; min-height: 92px; display: flex; align-items: center; }
  #cap p { margin: 0; font-family: "Zen Kaku Gothic New"; font-weight: 900; font-size: 25px; line-height: 1.42; letter-spacing: .01em; }
  #cap small { font-size: 14px; color: #464d54; font-weight: 700; }
  #phone { position: absolute; left: 67px; top: 168px; width: 297px; height: 524px; border-radius: 26px; background: #173f33; box-shadow: 0 20px 40px -18px rgba(23,63,51,.55); }
  #screen { position: absolute; left: 8px; top: 8px; width: 281px; height: 508px; border-radius: 19px; overflow: hidden; background: #fff; }
  #app { width: 390px; height: 705px; border: 0; transform: scale(0.72); transform-origin: 0 0; }
  #tap { position: absolute; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; pointer-events: none; opacity: 0;
    background: rgba(245,162,90,.35); border: 3px solid #e07b2c; box-sizing: border-box; }
  .cover { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 30px 70px; opacity: 0; }
  #hook { background: inherit; background-color: #fdf6ea; }
  #hook h1 { margin: 0; font-family: "Zen Kaku Gothic New"; font-weight: 900; font-size: 41px; line-height: 1.4; letter-spacing: .01em; }
  #hook .kicker { display: inline-block; align-self: flex-start; margin-bottom: 18px; background: #1f5c4a; color: #fff; font-family: "Zen Kaku Gothic New"; font-weight: 900; font-size: 15px; padding: 4px 14px; border-radius: 999px; }
  #hook .who { margin-top: 22px; font-size: 15px; font-weight: 700; color: #464d54; }
  #scene { justify-content: flex-start; padding: 70px 26px 0; }
  #scene .time { align-self: flex-start; margin: 0; padding: 4px 16px; border-radius: 999px; background: #173f33; color: #fff; font-family: "Zen Kaku Gothic New"; font-weight: 900; font-size: 22px; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  #scene h2 { margin: 14px 0 0; font-family: "Zen Kaku Gothic New"; font-weight: 900; font-size: 32px; line-height: 1.38; }
  #scene .sub { margin: 8px 0 0; font-size: 18px; font-weight: 700; color: #464d54; line-height: 1.6; }
  #scene .art { margin-top: 18px; }
  #scene .art svg { display: block; width: 100%; height: auto; }
  #end { background: #1f5c4a; color: #fff; text-align: left; }
  #end .pill { align-self: flex-start; background: #f5a25a; color: #173f33; font-family: "Zen Kaku Gothic New"; font-weight: 900; font-size: 15px; padding: 4px 14px; border-radius: 999px; }
  #end h2 { margin: 16px 0 6px; font-family: "Zen Kaku Gothic New"; font-weight: 900; font-size: 36px; line-height: 1.35; }
  #end .lead { margin: 0; font-size: 17px; line-height: 1.7; color: #d9ebe2; }
  #end .save { margin-top: 26px; padding: 14px 16px; border: 2px dashed rgba(255,255,255,.45); border-radius: 14px; font-family: "Zen Kaku Gothic New"; font-weight: 900; font-size: 19px; line-height: 1.5; }
  #end .save b { color: #ffc98f; }
  #end .url { margin-top: 18px; font-size: 13px; color: #a9c7b9; letter-spacing: .03em; }
</style>
</head>
<body>
  <div class="series"><span class="seal">帳</span>ふくしのおたすけ帳 <span class="no" id="no"></span></div>
  <div id="cap"><p id="capText"></p></div>
  <div id="phone"><div id="screen"><iframe id="app" title="demo"></iframe></div></div>
  <div id="tap"></div>
  <div class="cover" id="hook"><span class="kicker" id="kicker"></span><h1 id="hookText"></h1><p class="who" id="who"></p></div>
  <div class="cover" id="scene"><p class="time" id="sceneTime"></p><h2 id="sceneTitle"></h2><p class="sub" id="sceneSub"></p><div class="art" id="sceneArt"></div></div>
  <div class="cover" id="end">
    <span class="pill">無料・登録なし</span>
    <h2>ふくしのおたすけ帳</h2>
    <p class="lead">介護・障害福祉・児童支援の書類を、<br>選ぶだけで下書き。19種類。</p>
    <p class="save">使ってみたい方は<br><b>プロフィールのリンク</b>から。<br>保存して、職場の人にも。</p>
    <p class="url" id="url"></p>
  </div>
</body>
</html>
